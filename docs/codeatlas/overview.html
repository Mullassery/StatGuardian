<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Architecture map of StatGuardian.</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "crates", "label": "crates", "description": "Owns 0 symbols across 0 file(s).", "linkUrl": "./crates.html"}}, {"data": {"id": "docs", "label": "docs", "description": "Owns 0 symbols across 12 file(s).", "linkUrl": "./docs.html"}}, {"data": {"id": "examples", "label": "examples", "description": "Owns 0 symbols across 4 file(s)."}}, {"data": {"id": "integrations", "label": "integrations", "description": "Owns 0 symbols across 0 file(s).", "linkUrl": "./integrations.html"}}, {"data": {"id": "python", "label": "python", "description": "Owns 0 symbols across 0 file(s).", "linkUrl": "./python.html"}}, {"data": {"id": "src", "label": "src", "description": "Owns 0 symbols across 0 file(s).", "linkUrl": "./src.html"}}, {"data": {"id": "tests", "label": "tests", "description": "Owns 109 symbols across 10 file(s)."}}, {"data": {"id": "tools", "label": "tools", "description": "Owns 0 symbols across 0 file(s).", "linkUrl": "./tools.html"}}, {"data": {"id": "StatGuardian", "label": "StatGuardian", "description": "Owns 0 symbols across 14 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "crates", "target": "docs", "label": "calls"}}, {"data": {"id": "edge_1", "source": "docs", "target": "crates", "label": "calls"}}, {"data": {"id": "edge_2", "source": "python", "target": "crates", "label": "calls"}}, {"data": {"id": "edge_3", "source": "python", "target": "docs", "label": "calls"}}, {"data": {"id": "edge_4", "source": "tests", "target": "crates", "label": "calls"}}, {"data": {"id": "edge_5", "source": "tests", "target": "docs", "label": "calls"}}, {"data": {"id": "edge_6", "source": "tests", "target": "python", "label": "calls"}}, {"data": {"id": "edge_7", "source": "tools", "target": "crates", "label": "calls"}}, {"data": {"id": "edge_8", "source": "tools", "target": "docs", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
