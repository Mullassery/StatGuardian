[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-statguardian"
version = "0.1.0"
description = "Apache Airflow operator for StatGuardian data-quality contracts"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
  "apache-airflow>=2.7",
  "statguardian>=2.7",
]

[project.urls]
Homepage = "https://github.com/Mullassery/StatGuardian"
Repository = "https://github.com/Mullassery/StatGuardian"

[tool.setuptools.packages.find]
include = ["airflow_statguardian*"]
