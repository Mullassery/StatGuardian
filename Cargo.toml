[workspace]
members = [
    "crates/statguardian-core",
    "crates/statguardian-engine",
    "crates/statguardian-validators",
    "crates/statguardian-stats",
    "crates/statguardian-io",
    "crates/statguardian-metrics",
    "crates/statguardian-lineage",
    "crates/statguardian-py",
    "tests",
]
resolver = "2"

[workspace.package]
version = "2.6.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/statguardian"

[workspace.dependencies]
# Data processing
polars = { version = "0.55", features = [
    "lazy", "parquet", "csv", "json", "ipc",
    "avro",
    "strings", "regex", "dtype-date", "dtype-datetime",
    "describe", "rolling_window", "rank", "moment",
    "is_unique", "is_in", "cum_agg", "dynamic_group_by",
] }

# Parsing
pest    = "2.7"
pest_derive = "2.7"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow    = "1.0"

# Concurrency
rayon = "1.10"

# Utilities
regex   = "1.10"
chrono  = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.0", features = ["serde"] }
uuid    = { version = "1.6", features = ["v4", "serde"] }
log     = "0.4"
env_logger = "0.11"

# Python bindings
pyo3          = { version = "0.29", features = ["extension-module", "abi3-py38"] }
# NOTE: deliberately no "derive" feature. This crate only uses
# `pyo3_polars::PyDataFrame` (in the always-available `types` module, not
# gated on "derive"). "derive" pulls in `polars-plan/python`, which enables
# polars-core's `object` dtype feature — and polars-ops 0.55.2's
# `unique_counts` has a non-exhaustive match over `DataType` that doesn't
# handle `DataType::Object(_)`, so anything that enables `object` fails to
# compile against polars-ops 0.55.2. This is an upstream polars-ops bug
# (traceable to `polars-ops-0.55.2/src/series/ops/unique.rs:45`), not
# something fixable here; avoiding "derive" (which we don't need) sidesteps
# it entirely.
pyo3-polars   = { version = "0.28", features = ["dtype-struct", "dtype-array", "dtype-categorical", "dtype-decimal"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.release-python]
inherits      = "release"
strip         = "symbols"
